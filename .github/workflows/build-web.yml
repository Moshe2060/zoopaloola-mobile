name: Build and publish Web game

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pack project zip for phone download
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=zip --output=/tmp/zoopaloola-improvements.zip HEAD
          test "$(wc -c < /tmp/zoopaloola-improvements.zip)" -ge 1000
          ls -lh /tmp/zoopaloola-improvements.zip

      - name: Extract Godot project
        run: unzip -q Zoopaloola-Godot-Mobile.zip

      - name: Apply current landscape game files
        run: |
          bash scripts/apply-godot-assets.sh
          # Web players must download the full PCK before the first frame.
          # Disable desktop/mobile VRAM variants before the initial import so
          # large WebP menu backgrounds stay compact inside that download.
          sed -i '/^\[rendering\]$/a textures/vram_compression/import_s3tc_bptc=false\ntextures/vram_compression/import_etc2_astc=false' zoopaloola_godot_mobile/project.godot

      - name: Add Web export preset
        working-directory: zoopaloola_godot_mobile
        run: |
          cat >> export_presets.cfg <<'EOF'

          [preset.1]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          # The interface is mostly large 2D artwork. Desktop VRAM compression
          # expands those already-compressed WebP files inside the PCK (the
          # previous bundle reached 62 MB), which makes mobile startup appear
          # frozen. Keep the compact source representation for the Web build.
          vram_texture_compression/for_desktop=false
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=true
          progressive_web_app/ensure_cross_origin_isolation_headers=true
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=1
          progressive_web_app/icon_144x144="res://assets/ui/zoovortex-app-icon-v1.jpg"
          progressive_web_app/icon_180x180="res://assets/ui/zoovortex-app-icon-v1.jpg"
          progressive_web_app/icon_512x512="res://assets/ui/zoovortex-app-icon-v1.jpg"
          progressive_web_app/background_color=Color(0.0118, 0.0549, 0.102, 1)
          EOF

      - name: Configure Web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          cp -R /root/.local/share/godot/export_templates/4.4.stable/. "$HOME/.local/share/godot/export_templates/4.4.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/web_nothreads_release.zip"

      - name: Import and validate project
        working-directory: zoopaloola_godot_mobile
        run: |
          godot --headless --editor --path . --quit-after 20 > /tmp/godot-import.log 2>&1
          cat /tmp/godot-import.log
          if grep -Eq 'Error loading image|Error importing|Failed loading resource' /tmp/godot-import.log; then
            exit 1
          fi
          # Godot defaults 2D textures to lossless CTEX. For photographic
          # backgrounds that expands a ~200 KB WebP to ~2.5 MB in the PCK.
          # Switch the generated texture imports to high-quality lossy CTEX,
          # clear only generated imports, then rebuild them for the Web bundle.
          find assets -type f -name '*.import' -exec sed -i 's/^compress\/mode=0$/compress\/mode=1/' {} +
          rm -rf .godot/imported
          godot --headless --editor --path . --quit-after 40 > /tmp/godot-web-import.log 2>&1
          cat /tmp/godot-web-import.log
          if grep -Eq 'Error loading image|Error importing|Failed loading resource' /tmp/godot-web-import.log; then
            exit 1
          fi
          godot --headless --path . --quit-after 3 > /tmp/godot-validation.log 2>&1
          cat /tmp/godot-validation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|could not be loaded' /tmp/godot-validation.log; then
            exit 1
          fi

      - name: Export Web game
        working-directory: zoopaloola_godot_mobile
        run: |
          mkdir -p build/web
          EXPORT_NAME="game-${GITHUB_SHA}"
          godot --headless --verbose --path . --export-release "Web" "build/web/${EXPORT_NAME}.html"
          test -s "build/web/${EXPORT_NAME}.html"
          test -s "build/web/${EXPORT_NAME}.wasm"
          test -s "build/web/${EXPORT_NAME}.pck"
          # Keep the public entry point stable while giving every Godot bundle
          # a unique filename, so mobile browsers cannot reuse an older game.
          mv "build/web/${EXPORT_NAME}.html" build/web/index.html
          # Godot refuses to replace an existing service worker registration.
          # Add a tiny build-aware bootstrap that removes the previous PWA cache
          # once per release before the new engine bundle starts.
          cp "$GITHUB_WORKSPACE/web-cache-reset.js" build/web/web-cache-reset.js
          sed -i "s#<html lang=\"en\">#<html lang=\"en\" data-build=\"${GITHUB_SHA}\">#" build/web/index.html
          sed -i 's#<script src="game-#<script src="web-cache-reset.js"></script>\n\t\t<script src="game-#' build/web/index.html
          grep -q 'data-build=' build/web/index.html
          grep -q 'web-cache-reset.js' build/web/index.html
          # Godot writes an absolute-root PWA start URL, which opens the domain
          # root on GitHub project Pages and produces a 404. Keep all install
          # metadata relative to this manifest's /zoopaloola-mobile/ folder.
          MANIFEST_PATH="build/web/${EXPORT_NAME}.manifest.json"
          sed -i -E 's#("start_url"[[:space:]]*:[[:space:]]*)"[^"]*"#\1"./"#' "$MANIFEST_PATH"
          grep -Eq '"start_url"[[:space:]]*:[[:space:]]*"\./"' "$MANIFEST_PATH"
          cp "$GITHUB_WORKSPACE/download.html" build/web/download.html
          cp "$GITHUB_WORKSPACE/firebase-messaging-sw.js" build/web/firebase-messaging-sw.js
          cp /tmp/zoopaloola-improvements.zip build/web/zoopaloola-improvements.zip
          test -s build/web/zoopaloola-improvements.zip
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Build isolated 3D arena prototype
        working-directory: prototype3d
        run: |
          godot --headless --editor --path . --quit-after 20 > /tmp/godot-prototype-import.log 2>&1
          cat /tmp/godot-prototype-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|could not be loaded' /tmp/godot-prototype-import.log; then
            exit 1
          fi
          godot --headless --path . --quit-after 3 > /tmp/godot-prototype-validation.log 2>&1
          cat /tmp/godot-prototype-validation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|could not be loaded' /tmp/godot-prototype-validation.log; then
            exit 1
          fi
          mkdir -p build
          godot --headless --path . --export-release "Web" build/index.html
          test -s build/index.html
          test -s build/index.wasm
          test -s build/index.pck
          # Give every prototype payload a commit-specific URL. A query string
          # on index.html alone does not invalidate Godot's index.pck/index.wasm
          # cache, which can leave phones running the previous prototype.
          PROTOTYPE_BUILD="prototype-$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          mv build/index.js "build/${PROTOTYPE_BUILD}.js"
          mv build/index.wasm "build/${PROTOTYPE_BUILD}.wasm"
          mv build/index.pck "build/${PROTOTYPE_BUILD}.pck"
          sed -i \
            -e "s#src=\"index.js\"#src=\"${PROTOTYPE_BUILD}.js\"#" \
            -e "s#\"executable\":\"index\"#\"executable\":\"${PROTOTYPE_BUILD}\"#" \
            -e "s#\"index.pck\"#\"${PROTOTYPE_BUILD}.pck\"#g" \
            -e "s#\"index.wasm\"#\"${PROTOTYPE_BUILD}.wasm\"#g" \
            build/index.html
          grep -q "${PROTOTYPE_BUILD}.js" build/index.html
          grep -q "${PROTOTYPE_BUILD}.pck" build/index.html
          grep -q "${PROTOTYPE_BUILD}.wasm" build/index.html
          mkdir -p "$GITHUB_WORKSPACE/zoopaloola_godot_mobile/build/web/prototype3d"
          cp -R build/. "$GITHUB_WORKSPACE/zoopaloola_godot_mobile/build/web/prototype3d/"

      - name: Wait for Android release
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            for (let attempt = 1; attempt <= 60; attempt++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'build-android.yml',
                head_sha: sha,
                per_page: 1,
              });
              const run = runs.data.workflow_runs[0];
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') {
                  core.setFailed(`Android workflow finished with: ${run.conclusion}`);
                }
                core.info(`Android workflow completed on attempt ${attempt}`);
                return;
              }
              core.info(`Waiting for Android workflow (${attempt}/60)...`);
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            core.setFailed('Timed out waiting for Android workflow');

      - name: Add APK to Pages for phone download
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          APK_URL="https://github.com/Moshe2060/zoopaloola-mobile/releases/download/android/Zoopaloola.apk"
          OUT="zoopaloola_godot_mobile/build/web/Zoopaloola.apk"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$APK_URL" -o "$OUT"; then
              test -s "$OUT"
              ls -lh "$OUT"
              exit 0
            fi
            echo "APK download failed (attempt ${attempt}/12), retrying..."
            sleep 10
          done
          echo "Could not download APK; continuing without bundled APK."
          exit 0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zoopaloola_godot_mobile/build/web

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
