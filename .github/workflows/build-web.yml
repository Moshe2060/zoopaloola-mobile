name: Build and publish Web game

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pack project zip for phone download
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq zip
          fi
          cd "$GITHUB_WORKSPACE"
          zip -r /tmp/zoopaloola-improvements.zip . \
            -x '.git/*' \
            -x '.git/**' \
            -x 'zoopaloola_godot_mobile/*' \
            -x 'zoopaloola_godot_mobile/**'
          test -s /tmp/zoopaloola-improvements.zip
          ls -lh /tmp/zoopaloola-improvements.zip

      - name: Extract Godot project
        run: unzip -q Zoopaloola-Godot-Mobile.zip

      - name: Apply current landscape game files
        run: bash scripts/apply-godot-assets.sh

      - name: Add Web export preset
        working-directory: zoopaloola_godot_mobile
        run: |
          cat >> export_presets.cfg <<'EOF'

          [preset.1]

          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""
          seed=0
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.1.options]

          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          variant/thread_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=true
          progressive_web_app/enabled=true
          progressive_web_app/ensure_cross_origin_isolation_headers=true
          progressive_web_app/offline_page=""
          progressive_web_app/display=1
          progressive_web_app/orientation=1
          progressive_web_app/icon_144x144="res://assets/ui/zoopaloola-boot-splash-v2.png"
          progressive_web_app/icon_180x180="res://assets/ui/zoopaloola-boot-splash-v2.png"
          progressive_web_app/icon_512x512="res://assets/ui/zoopaloola-boot-splash-v2.png"
          progressive_web_app/background_color=Color(0.0118, 0.0549, 0.102, 1)
          EOF

      - name: Configure Web export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          cp -R /root/.local/share/godot/export_templates/4.4.stable/. "$HOME/.local/share/godot/export_templates/4.4.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.stable/web_nothreads_release.zip"

      - name: Import and validate project
        working-directory: zoopaloola_godot_mobile
        run: |
          godot --headless --editor --path . --quit-after 20 > /tmp/godot-import.log 2>&1
          cat /tmp/godot-import.log
          if grep -Eq 'Error loading image|Error importing|Failed loading resource' /tmp/godot-import.log; then
            exit 1
          fi
          godot --headless --path . --quit-after 3 > /tmp/godot-validation.log 2>&1
          cat /tmp/godot-validation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|could not be loaded' /tmp/godot-validation.log; then
            exit 1
          fi

      - name: Export Web game
        working-directory: zoopaloola_godot_mobile
        run: |
          mkdir -p build/web
          EXPORT_NAME="game-${GITHUB_SHA}"
          godot --headless --verbose --path . --export-release "Web" "build/web/${EXPORT_NAME}.html"
          test -s "build/web/${EXPORT_NAME}.html"
          test -s "build/web/${EXPORT_NAME}.wasm"
          test -s "build/web/${EXPORT_NAME}.pck"
          # Keep the public entry point stable while giving every Godot bundle
          # a unique filename, so mobile browsers cannot reuse an older game.
          mv "build/web/${EXPORT_NAME}.html" build/web/index.html
          # Godot writes an absolute-root PWA start URL, which opens the domain
          # root on GitHub project Pages and produces a 404. Keep all install
          # metadata relative to this manifest's /zoopaloola-mobile/ folder.
          MANIFEST_PATH="build/web/${EXPORT_NAME}.manifest.json"
          sed -i -E 's#("start_url"[[:space:]]*:[[:space:]]*)"[^"]*"#\1"./"#' "$MANIFEST_PATH"
          grep -Eq '"start_url"[[:space:]]*:[[:space:]]*"\./"' "$MANIFEST_PATH"
          cp "$GITHUB_WORKSPACE/download.html" build/web/download.html
          cp /tmp/zoopaloola-improvements.zip build/web/zoopaloola-improvements.zip
          test -s build/web/zoopaloola-improvements.zip
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Add APK to Pages for phone download
        run: |
          curl -fL --retry 5 --retry-delay 2 \
            -o zoopaloola_godot_mobile/build/web/Zoopaloola.apk \
            "https://github.com/Moshe2060/zoopaloola-mobile/releases/latest/download/Zoopaloola.apk"
          test -s zoopaloola_godot_mobile/build/web/Zoopaloola.apk
          ls -lh zoopaloola_godot_mobile/build/web/Zoopaloola.apk

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: zoopaloola_godot_mobile/build/web

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
