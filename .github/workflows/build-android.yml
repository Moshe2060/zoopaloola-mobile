name: Build Android APK
# Faithful transparent portrait board

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Godot project
        run: unzip -q Zoopaloola-Godot-Mobile.zip

      - name: Apply approved remastered assets
        run: |
          cp mobile-v02.gd zoopaloola_godot_mobile/scripts/main.gd
          cp board-clean-modular.webp zoopaloola_godot_mobile/assets/board-clean-modular.webp
          mkdir -p zoopaloola_godot_mobile/assets/remastered_effects
          cp effect-*.png zoopaloola_godot_mobile/assets/remastered_effects/
          mkdir -p zoopaloola_godot_mobile/assets/animal_pieces
          cp animal_pieces/*.png zoopaloola_godot_mobile/assets/animal_pieces/
          mkdir -p zoopaloola_godot_mobile/assets/rubber_trap/hands
          mkdir -p zoopaloola_godot_mobile/assets/rubber_launcher
          cp rubber_launcher/launcher.svg zoopaloola_godot_mobile/assets/rubber_launcher/launcher.svg
          cp rubber_launcher/wrap-sequence.svg zoopaloola_godot_mobile/assets/rubber_launcher/wrap-sequence.svg
          mkdir -p zoopaloola_godot_mobile/assets/fire_trap
          cp assets/fire_trap/flamethrower-v2.svg zoopaloola_godot_mobile/assets/fire_trap/flamethrower-v2.svg
          mkdir -p zoopaloola_godot_mobile/assets/press_trap
          cp assets/press_trap/industrial-press.svg zoopaloola_godot_mobile/assets/press_trap/industrial-press.svg
          mkdir -p zoopaloola_godot_mobile/assets/ui
          cp assets/ui/zoopaloola-splash.svg zoopaloola_godot_mobile/assets/ui/zoopaloola-splash.svg
          cp assets/ui/zoopaloola-home-bg-v3.webp zoopaloola_godot_mobile/assets/ui/zoopaloola-home-bg-v3.webp
          cp assets/ui/zoopaloola-loading-team-v1.webp zoopaloola_godot_mobile/assets/ui/zoopaloola-loading-team-v1.webp
          cp assets/ui/zoopaloola-logo-v1.webp zoopaloola_godot_mobile/assets/ui/zoopaloola-logo-v1.webp
          cp assets/ui/zoopaloola-boot-splash-v1.png zoopaloola_godot_mobile/assets/ui/zoopaloola-boot-splash-v1.png
          mkdir -p zoopaloola_godot_mobile/assets/ui/full_body
          cp assets/ui/full_body/*.webp zoopaloola_godot_mobile/assets/ui/full_body/
          sed -i 's/config\/name="Zoopaloola Mobile Prototype"/config\/name="Zoopaloola"/' zoopaloola_godot_mobile/project.godot
          sed -i '/^config\/name="Zoopaloola"$/a boot_splash/image="res://assets/ui/zoopaloola-boot-splash-v1.png"\nboot_splash/bg_color=Color(0.0118, 0.0549, 0.102, 1)\nconfig/icon="res://assets/ui/zoopaloola-splash.svg"' zoopaloola_godot_mobile/project.godot
          mkdir -p zoopaloola_godot_mobile/assets/hammer_trap
          cp assets/hammer_trap/mechanical-hammer-v2.svg zoopaloola_godot_mobile/assets/hammer_trap/mechanical-hammer-v2.svg
          mkdir -p zoopaloola_godot_mobile/assets/hammer_trap/remastered
          cp assets/hammer_trap/remastered/*.png zoopaloola_godot_mobile/assets/hammer_trap/remastered/
          cp rubber_trap/rubber-ball.png zoopaloola_godot_mobile/assets/rubber_trap/
          cp rubber_trap/hands/pose-*.png zoopaloola_godot_mobile/assets/rubber_trap/hands/

      - name: Configure Android exporter
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.stable"
          cp -R /root/.local/share/godot/export_templates/4.4.stable/. "$HOME/.local/share/godot/export_templates/4.4.stable/"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Zoopaloola,C=IL" -keyalg RSA -validity 10000
          JAVA_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          ANDROID_SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s/.android/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_SDK" "$JAVA_SDK" "$HOME" > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Install Godot Android SDK requirements
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure built-in Android exporter
        working-directory: zoopaloola_godot_mobile
        run: |
          sed -i 's|gradle_build/use_gradle_build=true|gradle_build/use_gradle_build=false|' export_presets.cfg
          sed -i '/gradle_build.min_sdk=/d; /gradle_build.target_sdk=/d' export_presets.cfg
          if ! grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot; then
            sed -i '/^\[rendering\]$/a textures/vram_compression/import_etc2_astc=true' project.godot
          fi
          echo "Installed Android platforms:"
          find "${ANDROID_HOME:-/usr/lib/android-sdk}/platforms" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort
          echo "Installed Android build tools:"
          find "${ANDROID_HOME:-/usr/lib/android-sdk}/build-tools" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | sort
          echo "Effective Android preset values:"
          grep -E 'gradle_build/(use_gradle_build|min_sdk|target_sdk)' export_presets.cfg || true
          grep 'textures/vram_compression/import_etc2_astc' project.godot

      - name: Import project assets
        working-directory: zoopaloola_godot_mobile
        run: |
          godot --headless --editor --path . --quit-after 20 > /tmp/godot-import.log 2>&1
          cat /tmp/godot-import.log
          if grep -Eq 'Error loading image|Error importing|Failed loading resource' /tmp/godot-import.log; then
            echo "Godot asset import failed."
            exit 1
          fi

      - name: Validate game scene
        working-directory: zoopaloola_godot_mobile
        run: |
          godot --headless --path . --quit-after 3 > /tmp/godot-validation.log 2>&1
          cat /tmp/godot-validation.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|Failed loading resource|could not be loaded' /tmp/godot-validation.log; then
            echo "Godot script validation failed."
            exit 1
          fi

      - name: Build debug APK
        working-directory: zoopaloola_godot_mobile
        run: |
          mkdir -p build
          if ! godot --headless --verbose --path . --export-debug "Android" build/Zoopaloola-debug.apk; then
            echo "Initial export failed; retrying after the filesystem scan settles..."
            sleep 3
            godot --headless --verbose --path . --export-debug "Android" build/Zoopaloola-debug.apk
          fi
          test -s build/Zoopaloola-debug.apk
          ls -lh build/Zoopaloola-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zoopaloola-Android-APK
          path: zoopaloola_godot_mobile/build/Zoopaloola-debug.apk
          if-no-files-found: error
          retention-days: 30
