name: Test match server

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - ".github/workflows/test-server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/test-server.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
